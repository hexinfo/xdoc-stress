[package]
name = "xdoc-stress-iced"
version = "0.3.5"
edition = "2021"

[dependencies]
stress-core = { path = "../stress-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = "1"
# 原生文件对话框：macOS 原生面板；Linux 走 xdg-desktop-portal（不引入 GTK）
# xdg-portal 后端必须带 tokio feature，否则 build.rs 直接 panic（tokio 复用现有依赖，不增体积）
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# 剪贴板（复制结果）
arboard = "3"
# iced:纯 Rust GUI；tiny-skia 软件渲染（无 GPU/wgpu，兼容信创）；仅 X11 不带 Wayland；tokio 执行器
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "tokio",
    "x11",
    "lazy"
] }
