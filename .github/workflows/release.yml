# Release:打 v* 标签 → 三平台打包 → 发布到 GitHub Releases
#
# 产物:
#   Linux tar.xz (x86_64/aarch64, Debian 10 glibc 2.28 地板, iced GUI, tiny-skia 软件渲染)
#   Windows exe  (x86_64, MSVC 原生编译, iced GUI)


name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux x86_64 (Debian 10 容器, glibc 2.28) ──
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .ci-cache
            target
          key: iced-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: iced-x86_64-cargo-
      - run: bash scripts/pack-iced-linux.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarxz
          path: dist/*.tar.xz

  # ── Linux aarch64 (GitHub 原生 arm64 runner, Debian 10 容器) ──
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .ci-cache
            target
          key: iced-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: iced-aarch64-cargo-
      - run: bash scripts/pack-iced-linux.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-tarxz
          path: dist/*.tar.xz

  # ── Windows x86_64 (MSVC 原生编译) ──
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-iced
          shared-key: release-windows
      - run: cargo build --release --manifest-path src-iced/Cargo.toml
        shell: bash
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ -n "$VERSION" ] || VERSION=$(grep -m1 '^version' src-iced/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          mkdir -p dist
          cp target/release/xdoc-stress-iced.exe "dist/xdoc-stress_${VERSION}_windows-x64.exe"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  publish:
    needs: [linux-x86_64, linux-aarch64, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/* --title "xdoc-stress $TAG" --generate-notes -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
