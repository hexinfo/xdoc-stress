# Release:打 v* 标签 → 三平台打包 → 发布到 GitHub Releases
#
# 产物:
#   Linux tar.xz (x86_64/aarch64, Debian 10 glibc 2.28 地板, iced GUI, tiny-skia 软件渲染)
#   Windows exe  (x64 + x86 双包, MSVC 原生编译, win7-windows-msvc 目标, Win7 ~ Win11)


name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux x86_64 (Debian 10 容器, glibc 2.28) ──
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .ci-cache
            target
          key: iced-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: iced-x86_64-cargo-
      - run: bash scripts/pack-iced-linux.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarxz
          path: dist/*.tar.xz

  # ── Linux aarch64 (GitHub 原生 arm64 runner, Debian 10 容器) ──
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .ci-cache
            target
          key: iced-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: iced-aarch64-cargo-
      - run: bash scripts/pack-iced-linux.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-tarxz
          path: dist/*.tar.xz

  # ── Windows (MSVC 原生编译, Win7 兼容目标; 与 Linux 对应出双架构包:
  #    x64 主流 + x86 覆盖 32 位老 Win7 机器,32 位系统无法运行 x64 产物) ──
  # Win7 兼容原理:*-win7-windows-msvc(tier 3 目标,std 无预编译,需 -Zbuild-std
  # 从源码编 std)下,std 自动把 GetSystemTimePreciseAsFileTime 降级为
  # GetSystemTimeAsFileTime、WaitOnAddress 族改为运行时 GetProcAddress 延迟加载、
  # 去掉 ProcessPrng 硬导入;getrandom 走 windows_legacy(RtlGenRandom)后端;
  # +crt-static 静态链接 UCRT/VCRUNTIME,Win7 无补丁机器也无需 VC 运行库。
  # 同一产物在 Win8/10/11 上照常运行(新 API 存在时延迟加载自动启用)。
  # 注:延迟/耗时计量全部走 Instant(QPC),不受 win7 目标 SystemTime 降精度影响。
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-win7-windows-msvc, arch: x64 }
          - { target: i686-win7-windows-msvc, arch: x86 }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-iced
          shared-key: release-windows-win7-${{ matrix.target }}
      # 钉死 nightly 版本保证可复现;-Zbuild-std 仅 nightly 可用
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-08
          components: rust-src
      - run: rustup default nightly-2026-09-08
        shell: bash
      - run: |
          RUSTFLAGS='-C target-feature=+crt-static --cfg getrandom_backend="windows_legacy"' \
          cargo build --release --manifest-path src-iced/Cargo.toml \
            --target ${{ matrix.target }} \
            -Zbuild-std=std,panic_abort
        shell: bash
      # Win7 兼容闸门:导入表禁止 Win8+/Win10+ 硬导入与动态 CRT 依赖(防回归)
      - run: python scripts/check_win7_imports.py target/${{ matrix.target }}/release/xdoc-stress-iced.exe
        shell: bash
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ -n "$VERSION" ] || VERSION=$(grep -m1 '^version' src-iced/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xdoc-stress-iced.exe "dist/xdoc-stress_${VERSION}_windows-${{ matrix.arch }}.exe"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ matrix.arch }}
          path: dist/*.exe

  publish:
    needs: [linux-x86_64, linux-aarch64, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/* --title "xdoc-stress $TAG" --generate-notes -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
