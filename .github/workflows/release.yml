# Release:打 v* 标签 → Linux 双架构打包 → 发布到 GitHub Releases
#
# 产物:Linux tar.xz(x86_64/aarch64, Debian 10 glibc 2.28 地板)
# 说明:Slint GUI(纯 Rust 软件渲染)在 Debian 10 容器内编译,兼容 UOS 20/麒麟 V10 等信创系统;
#       不再产出 macOS/Windows 版本(Tauri 时代产物,已淘汰)

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux x86_64 (Debian 10 容器, glibc 2.28) ──
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .ci-cache
            target
          key: slint-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: slint-x86_64-cargo-
      - run: bash scripts/pack-slint-linux.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarxz
          path: dist/*.tar.xz

  # ── Linux aarch64 (GitHub 原生 arm64 runner, Debian 10 容器) ──
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .ci-cache
            target
          key: slint-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: slint-aarch64-cargo-
      - run: bash scripts/pack-slint-linux.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-tarxz
          path: dist/*.tar.xz

  publish:
    needs: [linux-x86_64, linux-aarch64]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/* --title "xdoc-stress $TAG" --generate-notes -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
