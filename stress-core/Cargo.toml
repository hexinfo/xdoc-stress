[package]
name = "stress-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
# rustls 静态 TLS：不依赖系统 OpenSSL（Debian 10 容器编译 / 信创目标机均无需 libssl）
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
