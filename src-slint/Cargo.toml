[package]
name = "xdoc-stress-slint"
version = "0.1.0"
edition = "2021"

[dependencies]
stress-core = { path = "../stress-core" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
# Slint:纯 Rust GUI，无 webkit/gtk，兼容 glibc 2.28
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
    "accessibility"
] }

[[bin]]
name = "xdoc-stress"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"
