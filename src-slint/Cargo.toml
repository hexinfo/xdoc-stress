[package]
name = "xdoc-stress-slint"
version = "0.2.0"
edition = "2021"

[dependencies]
stress-core = { path = "../stress-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde_json = "1"
# 原生文件对话框：macOS 原生面板；Linux 走 xdg-desktop-portal（不引入 GTK）
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }
# 剪贴板（复制结果）
arboard = "3"
# Slint:纯 Rust GUI，无 webkit/gtk，兼容 glibc 2.28
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2"
] }

[[bin]]
name = "xdoc-stress"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"
